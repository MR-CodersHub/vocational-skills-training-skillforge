<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon | SkillForge Vocational Training Institute</title>
  <meta name="description" content="A new SkillForge training facility and program is coming soon. Join the waitlist to be first to know." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <script src="../src/js/theme.js"></script>
  <link rel="stylesheet" href="../src/css/style.css" />
</head>
<body data-page="coming-soon">

  <div id="site-navbar"></div>

  <section class="state-page" aria-label="Coming soon">
    <div class="state-inner">
      <div class="state-code">SOON</div>
      <h1>OUR NEXT CAMPUS IS COMING</h1>
      <p>We are building a bigger, better training facility with new workshops, more equipment and a fresh renewable-energy lab. Enrollment opens soon.</p>
      <div class="countdown" id="countdown" data-deadline="2026-12-31T00:00:00">
        <div class="cd"><b data-cd="days">00</b><span>Days</span></div>
        <div class="cd"><b data-cd="hours">00</b><span>Hours</span></div>
        <div class="cd"><b data-cd="mins">00</b><span>Minutes</span></div>
        <div class="cd"><b data-cd="secs">00</b><span>Seconds</span></div>
      </div>
      <form class="validate-form" id="waitlist-form" novalidate style="max-width:460px;margin:0 auto;"
            data-success-message="You are on the list! We will email you the moment enrollment opens."
            data-error-message="Please enter a valid email address.">
        <div class="newsletter-field" style="border-color:var(--border);background:var(--white);">
          <input type="email" id="waitlist-email" name="waitlistEmail" placeholder="you@example.com" aria-label="Email address" required style="color:var(--text);" />
          <button type="submit" aria-label="Join waitlist"><svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
        </div>
        <span class="form-error" data-error-for="waitlist-email"></span>
        <div class="form-status form-status--compact" role="status" aria-live="polite" hidden></div>
      </form>
      <div class="state-actions" style="margin-top:2rem;">
        <a href="../index.html" class="btn btn-outline">Back to Home</a>
        <a href="services.html" class="btn btn-primary">Browse Current Courses</a>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="../src/js/data.js"></script>
  <script src="../src/js/navbar.js"></script>
  <script src="../src/js/footer.js"></script>
  <script src="../src/js/form-validation.js"></script>
  <script src="../src/js/main.js"></script>
</body>
</html>
